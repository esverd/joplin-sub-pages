<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/panel.css"><style>body{width:360px;height:520px}</style></head><body><div id="app"></div><script>
window.messages=[];
window.mockState={folder:{id:'f1',title:'Harness'},selectedNoteId:'child1',sortMode:'manual',noteCount:5,metadataItemCount:4,repairCount:0,error:null,nodes:[{id:'parent1',title:'Alpha Parent',isTodo:false,todoCompleted:false,repairReason:null,canMoveUp:false,canMoveDown:false,children:[{id:'child1',title:'Beta Child',isTodo:false,todoCompleted:false,repairReason:null,canMoveUp:false,canMoveDown:true,children:[]},{id:'child2',title:'Gamma Child',isTodo:true,todoCompleted:false,repairReason:null,canMoveUp:true,canMoveDown:false,children:[]}]},{id:'root2',title:'Delta Root',isTodo:false,todoCompleted:false,repairReason:null,canMoveUp:false,canMoveDown:false,children:[]},{id:'root3',title:'Epsilon Root',isTodo:false,todoCompleted:false,repairReason:null,canMoveUp:false,canMoveDown:false,children:[]}]};
window.mockBodies={root2:'Body mentions web clipper setup.',root3:'Other content'};
function walk(nodes, visitor){ for(const node of nodes){ visitor(node); walk(node.children||[], visitor); } }
window.webviewApi={postMessage: async (message)=>{ window.messages.push(message); if(message.name==='ready'||message.name==='refresh'||message.name==='stateIfChanged') return {ok:true, revision:1, state: window.mockState}; if(message.name==='selectedNoteState') return {ok:true, selectedNoteId: window.mockState.selectedNoteId}; if(message.name==='search'){ const query=String(message.query||'').trim().toLocaleLowerCase(); const noteIds=[]; if(query){ walk(window.mockState.nodes, node=>{ const haystack=`${node.title||''} ${window.mockBodies[node.id]||''}`.toLocaleLowerCase(); if(haystack.includes(query)) noteIds.push(node.id); }); } return {ok:true, query:message.query, noteIds}; } return {ok:true,message:message.name}; }, onMessage: (cb)=>{ window.receive=cb; }};
</script><script src="../src/panel.js"></script></body></html>
